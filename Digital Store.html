    <style>
        /* ==========================================================================
           ১. গ্লোবাল সেটিংস এবং আধুনিক ভেরিয়েবলস (Premium Theme)
           ========================================================================== */
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 15px -3px rgba(30, 58, 138, 0.05), 0 4px 6px -2px rgba(30, 58, 138, 0.02);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-main); 
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        
        /* ==========================================================================
           ②. সম্পূর্ণ ফ্রিজড এবং ১০০% রেসপন্সিভ হেডার জোন (Sticky Header Banner & Navigation)
           ========================================================================== */
        .sticky-header-container {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 2000;
            width: 100%;
            background-color: #ffffff;
            box-shadow: var(--shadow-md);
            border-bottom: 3px solid var(--accent);
        }

        .frozen-brand-banner { 
            width: 100%; 
            height: 140px; 
            /* 👇 এখানে তোমার ইমেজ ফাইল বা ইউআরএলটি বসিয়ে দেবে */
            background-image: url('ess2.png'); 
            background-size: contain; 
            background-position: center center; 
            background-repeat: no-repeat; 
            background-color: #ffffff; 
        }
        
        .header-control-bar {
            background-color: #1e3a8a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .header-home-link { 
            color: #ffffff; 
            text-decoration: none; 
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            transition: var(--transition);
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.15); 
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .header-home-link:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-1px); }
        
        .control-bar-actions { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
        }
        
        .header-cart-btn { 
            background: #10b981; 
            color: white; 
            padding: 8px 16px; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            white-space: nowrap; 
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.15);
            transition: var(--transition);
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .header-cart-btn:hover { background: #059669; transform: translateY(-1px); }
        
        .header-buynow-btn { 
            background: #f59e0b; 
            color: white; 
            padding: 8px 18px; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            white-space: nowrap; 
            font-weight: 800; 
            font-size: 13px;
            border: none; 
            text-transform: uppercase;
            box-shadow: 0 2px 4px rgba(245, 158, 11, 0.2);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .header-buynow-btn:hover { background: #d97706; transform: translateY(-1px); }

        /* ==========================================================================
           ③. সেকশন টাইটেল ও স্ক্রল র্যাপার
           ========================================================================== */
        .section-title { 
            background: transparent; 
            color: var(--primary); 
            padding: 10px 0; 
            margin: 25px auto 10px auto; 
            max-width: 1200px; 
            font-size: 24px; 
            font-weight: 800; 
            border-left: 5px solid var(--accent);
            padding-left: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        @media (max-width: 1240px) { .section-title { margin-left: 20px; margin-right: 20px; } }
        
        .scroll-wrapper { position: relative; max-width: 1240px; margin: auto; display: flex; align-items: center; padding: 0 10px; }
        
        .grid-container { 
            display: flex; 
            overflow-x: auto; 
            gap: 20px; 
            padding: 15px 10px 30px 10px; 
            width: 100%; 
            scroll-behavior: smooth; 
        }
        .grid-container::-webkit-scrollbar { display: none; }
        
        /* ==========================================================================
           ৪. প্রিমিয়াম প্রোডাক্টカード デザイン
           ========================================================================== */
        .product-card { 
            background: var(--card-bg); 
            border-radius: var(--radius-lg); 
            padding: 16px; 
            box-shadow: var(--shadow-md); 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            flex: 0 0 250px; 
            position: relative; 
            border: 1px solid var(--border-color); 
            transition: var(--transition);
        }
        .product-card:hover { 
            transform: translateY(-8px); 
            box-shadow: var(--shadow-lg);
            border-color: rgba(30, 58, 138, 0.15);
        }
        
        .product-card h3 { 
            font-size: 14px; 
            margin: 0 0 12px 0; 
            line-height: 1.4; 
            height: 40px; 
            overflow: hidden; 
            color: var(--text-main); 
            font-weight: 700; 
        }
        
        .image-box { 
            width: 100%; 
            height: 190px; 
            background: #f1f5f9; 
            margin-bottom: 12px; 
            border-radius: var(--radius-md); 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 1px solid rgba(0,0,0,0.02);
        }
        .image-box img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition); }
        .product-card:hover .image-box img { transform: scale(1.05); }
        
        .coming-soon-box { color: var(--text-muted); font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
        
        .preview-btn { 
            background: var(--bg-main); 
            color: var(--primary); 
            border: 1px solid var(--primary); 
            padding: 9px; 
            border-radius: var(--radius-sm); 
            font-weight: 700; 
            cursor: pointer; 
            margin-bottom: 8px; 
            width: 100%; 
            font-size: 12px; 
            transition: var(--transition); 
        }
        .preview-btn:hover { background: var(--primary); color: white; }

        .card-description-area {
            background: #f1f5f9;
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            margin-bottom: 12px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: left;
            line-height: 1.4;
            display: flex;
            align-items: flex-start;
            gap: 6px;
            border: 1px solid rgba(30, 58, 138, 0.03);
            min-height: 46px; 
        }
        .card-description-area .info-badge {
            background: var(--primary);
            color: white;
            font-size: 9px;
            font-weight: bold;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }
        
        .card-action-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 4px; 
            padding-top: 10px; 
            border-top: 1px dashed var(--border-color); 
            gap: 6px; 
        }
        
        .price-container { font-size: 13px; text-align: left; display: flex; flex-direction: column; justify-content: center; flex-shrink: 0; }
        .offer-price { color: var(--danger); font-weight: 800; font-size: 18px; display: block; line-height: 1.1; }
        .original-price { text-decoration: line-through; color: var(--text-muted); font-size: 12px; margin-top: 2px; }

        .discount-badge { 
            background: var(--danger-bg); 
            color: var(--danger); 
            font-size: 11px; 
            font-weight: 700; 
            padding: 4px 8px; 
            border-radius: 6px; 
            white-space: nowrap; 
        }

        .add-to-cart-text-btn { 
            background: #2563eb; 
            color: white; 
            border: none; 
            padding: 9px 14px; 
            border-radius: var(--radius-sm); 
            font-size: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: var(--transition); 
            min-width: 115px; 
            width: auto; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0; 
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.15);
        }
        .add-to-cart-text-btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 6px 12px rgba(37, 99, 235, 0.25); }
        .add-to-cart-text-btn.added { background: var(--success); color: white; cursor: default; box-shadow: none; }
        .add-to-cart-text-btn.added:hover { background: var(--success); transform: none; }
        
        .disabled-btn { 
            background: #e2e8f0; color: #94a3b8; border: none; padding: 9px 14px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700; cursor: not-allowed; 
            min-width: 115px; width: auto; display: inline-flex; align-items: center; justify-content: center;
        }

        .inactive-card-msg {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .nav-scroll-btn {
            position: absolute; top: 50%; transform: translateY(-50%); background: white; color: var(--primary); 
            border: 1px solid var(--border-color); width: 44px; height: 44px; border-radius: 50%; font-size: 22px; font-weight: bold; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: var(--shadow-md);
            transition: var(--transition);
        }
        .nav-scroll-btn:hover { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-50%) scale(1.1); }
        .nav-scroll-btn.left-btn { left: -15px; }
        .nav-scroll-btn.right-btn { right: -15px; }

        .preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-body { background: white; width: 92%; max-width: 950px; height: 85%; border-radius: var(--radius-lg); overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
        
        .close-modal-btn { 
            position: absolute; top: 0; right: 0; 
            width: 60px; height: 80px; 
            font-size: 32px; font-weight: bold; 
            color: #ef4444; background: #ffffff; 
            cursor: pointer; z-index: 2005; 
            border: none; border-radius: 0; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: -2px 2px 10px rgba(0,0,0,0.15);
            transition: var(--transition);
        }
        .close-modal-btn:hover { background: #ef4444; color: #ffffff; }

        /* ==========================================================================
           ৫. এক্সপ্রেস WhatsApp চেকআউট জোন
           ========================================================================== */
        .checkout-section { max-width: 600px; margin: 50px auto; background: white; padding: 35px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); display: none; border: 1px solid var(--border-color); text-align: center; }
        
        .live-payable-badge { font-size: 24px; font-weight: 800; color: var(--success); background: #e6f4ea; border: 2px dashed var(--success); padding: 12px; border-radius: var(--radius-sm); margin: 15px auto; display: inline-block; width: 90%; box-sizing: border-box; }
        
        .order-summary-box { background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; text-align: left; margin-bottom: 25px; }
        .order-summary-box h4 { margin: 0 0 10px 0; color: var(--primary); font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }

            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 16px;
            font-weight: 800;
            border-radius: var(--radius-md);
            cursor: pointer;
            width: 100%;
            display: block;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .express-whatsapp-pay-btn:hover {
            background: linear-gradient(135deg, #128c7e, #075e54);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 211, 102, 0.35);
        }

           ⑥. মোবাইল রেসপন্সিভ ওভাররাইড মিডিয়া কোয়েরি (Responsive Breakpoints)
           ========================================================================== */
        @media (max-width: 768px) { 
            .nav-scroll-btn { display: none; } 
            .grid-container { padding: 10px; gap: 14px; } 
            
            .frozen-brand-banner { height: 75px; }
            .header-control-bar { padding: 8px 10px; }
            .header-home-link { font-size: 11px; padding: 6px 10px; }
            .header-cart-btn { padding: 6px 10px; font-size: 11px; }
            .header-buynow-btn { padding: 6px 12px; font-size: 11px; }

            .section-title { font-size: 18px; margin: 25px 15px 5px 15px; }
            .product-card { flex: 0 0 215px; padding: 12px; border-radius: var(--radius-md); }
            .product-card h3 { font-size: 13px; height: 36px; margin-bottom: 8px; }
            .image-box { height: 160px; border-radius: var(--radius-sm); }
            .card-description-area { min-height: 52px; font-size: 10px; padding: 6px 8px; }
            .offer-price { font-size: 16px; }
            .discount-badge { font-size: 10px; padding: 2px 6px; }
            .add-to-cart-text-btn, .disabled-btn { min-width: 100px; width: auto; font-size: 11px; padding: 8px 10px; }
            .preview-btn { padding: 7px; font-size: 11px; margin-bottom: 8px; }
            .checkout-section { margin: 25px 15px; padding: 20px; }
        }
    </style>
</head>

        function scrollSection(gridId, direction) {
            const container = document.getElementById(gridId);

        function openPreview(url) { 
            document.getElementById('modalIframe').src = url; 
            document.getElementById('previewModal').style.display = 'flex'; 
        }
        
        function closePreview() { 
            document.getElementById('previewModal').style.display = 'none'; 
            document.getElementById('modalIframe').src = ''; 
        }

        function toggleCart(id, name, price) {
            const index = selectedCart.findIndex(item => item.id === id);
            const btn = document.getElementById(`btn-${id}`);
            
            if (index > -1) { 
                selectedCart.splice(index, 1); 
                btn.innerHTML = "Add to Cart"; 
                btn.classList.remove('added'); 
            } else { 
                selectedCart.push({ id: id, name: name, price: price }); 
                btn.innerHTML = "Added to Cart ✓"; 
                btn.classList.add('added'); 
            }
            document.getElementById('cartCount').innerText = selectedCart.length;
            updateOrderSummary();
        }

        function updateOrderSummary() {
            const checkoutSec = document.getElementById('checkoutSection');
            if(selectedCart.length > 0) {
                checkoutSec.style.display = "block";
                let listHtml = ""; let total = 0;
                selectedCart.forEach((item, i) => { listHtml += `<p>${i+1}. <strong>${item.name}</strong> — <span style="color:var(--danger); font-weight:bold;">₹${item.price}</span></p>`; total += item.price; });
                
                document.getElementById('selectedProductsList').innerHTML = listHtml;
                document.getElementById('qrPayableAmount').innerText = total;
            } else { 
                checkoutSec.style.display = "none"; 
            }
        }

            if(selectedCart.length === 0) { alert("Please add items first!"); return; }
            document.getElementById('checkoutSection').scrollIntoView({ behavior: 'smooth' });
